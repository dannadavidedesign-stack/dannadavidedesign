name: Deploy su GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      # Se il sito è solo HTML/CSS/JS puro (senza package.json), elimina i 2 step qui sotto
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Installa dipendenze e compila
        run: |
          npm ci
          npm run build

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Prepara i file per la pubblicazione
        uses: actions/upload-pages-artifact@v3
        with:
          # Usa "./dist" (Vite/Astro/Vue), "./build" (CRA) oppure "." se è HTML puro
          path: "./dist"

      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
