name: Deploy su GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Raccogli i file del sito pubblico
        run: |
          mkdir public
          cp -R index.html project.html assets css js public/
          python3 - <<'PYTHON'
          from hashlib import sha256
          from pathlib import Path

          root = Path("public")
          assets = {}

          for asset in [*root.glob("css/*.css"), *root.glob("js/*.js")]:
              source = asset.relative_to(root).as_posix()
              digest = sha256(asset.read_bytes()).hexdigest()[:16]
              assets[source] = f"{source}?v={digest}"

          for page in (root / "index.html", root / "project.html"):
              html = page.read_text(encoding="utf-8")
              for source, versioned in assets.items():
                  html = html.replace(f'"{source}"', f'"{versioned}"')
              page.write_text(html, encoding="utf-8")
          PYTHON

      - name: Prepara i file per la pubblicazione
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
