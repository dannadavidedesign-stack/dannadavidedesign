name: Deploy su GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installa le dipendenze del sito
        run: npm ci

      - name: Prepara il sito statico
        run: npm run build

      - name: Prepara i file per la pubblicazione
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
