<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio — Davide D’Anna Design Solutions</title>
    <meta name="description" content="Scopri i progetti di Davide D’Anna Design Solutions.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="it_IT">
    <meta property="og:site_name" content="Davide D’Anna Design Solutions">
    <meta property="og:title" content="Portfolio — Davide D’Anna Design Solutions">
    <meta property="og:description" content="Scopri i progetti di Davide D’Anna Design Solutions.">
    <meta property="og:image" content="https://davidedanna.com/assets/foto-profilo.jpeg">
    <meta property="og:image:alt" content="Ritratto di Davide D’Anna">
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Loader -->
    <div id="loader" class="loader">
        <div class="loader-line"></div>
    </div>

    <!-- Navigation -->
    <nav id="navbar" class="navbar hidden">
        <a href="/#hero" class="logo" aria-label="Davide D’Anna, home">
            <img src="/assets/logo.svg" alt="" width="50" height="36">
        </a>
        <div class="nav-links">
            <a href="/#work">Lavori</a>
            <a href="/#about">Chi sono</a>
            <a href="/#contact">Contatti</a>
        </div>
    </nav>

    <!-- Project content (rendered by js/project.js) -->
    <div id="project-shell"></div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true">
        <button class="lightbox-close" aria-label="Chiudi">&times;</button>
        <button class="lightbox-prev" aria-label="Immagine precedente">&#8592;</button>
        <img src="" alt="">
        <button class="lightbox-next" aria-label="Immagine successiva">&#8594;</button>
        <div class="lightbox-caption"></div>
        <span class="lightbox-counter"></span>
    </div>

    <!-- Custom cursor -->
    <div id="cursor" class="cursor"></div>
    <div id="cursor-follower" class="cursor-follower"></div>

    <script src="/js/common.js"></script>
    <script src="/js/project-data.js"></script>
    <script src="/js/project.js"></script>
</body>
</html>
